services:
  postgres:
    image: postgres:16-alpine
    container_name: modukitchen-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: modukitchen
      POSTGRES_USER: modukitchen
      POSTGRES_PASSWORD: modukitchen_local

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modukitchen -d modukitchen"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
